name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        build_type: [Release, Debug]

    steps:
    # ---------- 1. Checkout ----------
    - name: Checkout
      uses: actions/checkout@v4

    # ---------- 2. Install Conan 2 ----------
    - name: Install Conan
      run: |
        python3 -m pip install --upgrade pip
        pip install conan

    # ---------- 3. Detect Conan profile ----------
    - name: Detect Conan profile
      run: conan profile detect

    # ---------- 4. Install system dependencies (if any) ----------
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev   # OpenCV może wymagać

    # ---------- 5. Cache Conan packets ----------
    - name: Cache Conan packages
      uses: actions/cache@v4
      with:
        path: ~/.conan2
        key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py') }}
        restore-keys: conan-${{ runner.os }}-

    # ---------- 6. Install from Conan ----------
    - name: Conan install
      run: |
        conan install . --output-folder=build --build=missing -s build_type=${{ matrix.build_type }}

    # ---------- 7. Config CMake with tests ----------
    - name: CMake configure
      run: cmake --preset conan-release -DWITH_TESTS=ON

    # ---------- 8. Build ----------
    - name: Build
      run: cmake --build --preset conan-release

    # ---------- 9. Tests ----------
    - name: Test
      run: ctest --preset conan-release --output-on-failure