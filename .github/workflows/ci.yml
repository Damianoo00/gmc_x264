name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        build_type: [Release, Debug]

    steps:
    # ---------- 1. Checkout ----------
    - name: Checkout
      uses: actions/checkout@v4

# ---------- 2. Install Modern GCC (C++23 support) ----------
    - name: Install GCC 13
      run: |
        sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
        sudo apt-get update
        sudo apt-get install -y gcc-13 g++-13 libgl1-mesa-dev
        # Ustawiamy zmienne środowiskowe
        echo "CC=gcc-13" >> $GITHUB_ENV
        echo "CXX=g++-13" >> $GITHUB_ENV

    # ---------- 3. Install Conan 2 ----------
    - name: Install Conan
      run: |
        python3 -m pip install --upgrade pip
        pip install conan

    # ---------- 4. Detect Conan profile ----------
    - name: Detect Conan profile
      run: |
        # Wymuszamy detekcję z użyciem GCC 13
        conan profile detect --force

    # ---------- 5. Cache Conan packets ----------
    - name: Cache Conan packages
      uses: actions/cache@v4
      with:
        path: ~/.conan2
        key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py', 'conanfile.txt') }}-${{ matrix.build_type }}
        restore-keys: conan-${{ runner.os }}-

    # ---------- 6. Install from Conan ----------
    - name: Conan install
      run: |
        # Dodajemy parametr kompilatora, aby Conan nie próbował budować paczek starym GCC 11
        conan install . --output-folder=build --build=missing \
          -s build_type=${{ matrix.build_type }} \
          -s compiler.cppstd=23 \
          -c tools.system.package_manager:mode=install \
          -c tools.system.package_manager:sudo=True

    # ---------- 7. Config CMake with tests ----------
    - name: CMake configure
      run: |
        cmake --preset conan-${{ matrix.build_type == 'Release' && 'release' || 'debug' }} \
          -DWITH_TESTS=ON \
          -DCMAKE_CXX_COMPILER=g++-13

    # ---------- 8. Build ----------
    - name: Build
      run: cmake --build --preset conan-${{ matrix.build_type == 'Release' && 'release' || 'debug' }}

    # ---------- 9. Tests ----------
    - name: Test
      run: ctest --preset conan-${{ matrix.build_type == 'Release' && 'release' || 'debug' }} --output-on-failure